<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KK5 Admin Dashboard</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --dark-banner: #0f172a;
    }

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
    .container { max-width: 1400px; margin: 0 auto; }

    /* Login Screen */
    .login-box { max-width: 380px; margin: 80px auto; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .login-box h2 { margin-top: 0; font-size: 22px; color: #0f172a; }
    .login-box p { color: #64748b; font-size: 13px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 11px; color: #475569; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select { width: 100%; height: 42px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #0f172a; }
    .btn-login { width: 100%; height: 42px; background: #0f172a; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .error-msg { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 12px; text-align: center; }
    .hidden { display: none !important; }

    /* Hero Banner */
    .hero-banner { background: var(--dark-banner); color: white; border-radius: 14px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .hero-banner h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .hero-banner p { margin: 4px 0 0; color: #94a3b8; font-size: 13px; }
    .btn-refresh { background: #ffffff; color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-refresh:hover { background: #f1f5f9; }

    /* Stat Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; }
    .stat-card h3 { margin: 0 0 6px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .stat-card .number { font-size: 26px; font-weight: 800; color: #0f172a; }

    /* Filter Toolbar Container */
    .filter-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr; gap: 10px; align-items: flex-end; }
    .filter-item { display: flex; flex-direction: column; gap: 4px; }

    /* Table Container with Controlled Widths */
    .table-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; table-layout: fixed; }
    
    th { padding: 12px 10px; font-weight: 700; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #f1f5f9; }
    td { padding: 14px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; vertical-align: top; word-break: break-word; }
    tr:hover td { background: #f8fafc; }

    /* Badges & Tags */
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.approved { background: #d4edda; color: #155724; }
    .badge.rejected { background: #f8d7da; color: #721c24; }
    .badge.cancelled { background: #e2e3e5; color: #383d41; }

    .jkp-tag { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-top: 4px; text-transform: uppercase; }
    .action-select { width: 110px; height: 32px; padding: 0 4px; font-size: 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: 600; cursor: pointer; }

    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .filter-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="loginView">
    <div class="login-box">
      <h2>KK5 Admin Portal</h2>
      <p>Enter administrator credentials to manage facility reservations.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
        <div id="loginError" class="error-msg hidden"></div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" class="container hidden">
    <!-- Hero Banner -->
    <div class="hero-banner">
      <div>
        <h1>KK5 Admin Dashboard</h1>
        <p>Manage facility booking requests.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn-refresh" onclick="loadDashboardData()">🔄 Refresh</button>
        <button type="button" class="btn-refresh" style="background:#ef4444; color:white;" onclick="logoutAdmin()">Sign Out</button>
      </div>
    </div>

    <!-- Stat Summary Cards -->
    <div class="stats-grid">
      <div class="stat-card"><h3>TOTAL</h3><div id="statTotal" class="number">0</div></div>
      <div class="stat-card"><h3>PENDING</h3><div id="statPending" class="number">0</div></div>
      <div class="stat-card"><h3>APPROVED</h3><div id="statApproved" class="number">0</div></div>
      <div class="stat-card"><h3>REJECTED</h3><div id="statRejected" class="number">0</div></div>
      <div class="stat-card"><h3>CANCELLED</h3><div id="statCancelled" class="number">0</div></div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="filter-card">
      <div class="filter-grid">
        <div class="filter-item">
          <label>SEARCH</label>
          <input type="text" id="searchInput" placeholder="Booking ID, name, matric, email..." oninput="renderBookings()">
        </div>
        <div class="filter-item">
          <label>STATUS</label>
          <select id="statusFilter" onchange="renderBookings()">
            <option value="ALL">All statuses</option>
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>
        <div class="filter-item">
          <label>FACILITY</label>
          <select id="facilityFilter" onchange="renderBookings()">
            <option value="ALL">All facilities</option>
          </select>
        </div>
        <div class="filter-item">
          <label>JKP IN CHARGE</label>
          <select id="jkpFilter" onchange="renderBookings()">
            <option value="ALL">All JKP</option>
          </select>
        </div>
        <div class="filter-item">
          <label>DATE</label>
          <input type="date" id="dateFilter" onchange="renderBookings()">
        </div>
        <div class="filter-item">
          <label>SORT</label>
          <select id="sortSelect" onchange="renderBookings()">
            <option value="newest">Latest booking</option>
            <option value="oldest">Oldest booking</option>
            <option value="date_asc">Event Date (Soonest)</option>
            <option value="status">Status Priority</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Bookings Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width: 16%;">BOOKING</th>
            <th style="width: 18%;">FACILITY</th>
            <th style="width: 16%;">DATE / TIME</th>
            <th style="width: 22%;">BOOKER</th>
            <th style="width: 16%;">PURPOSE</th>
            <th style="width: 12%;">STATUS</th>
            <th style="width: 10%;">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="bookingsTableBody">
          <tr><td colspan="7" style="text-align:center; padding:30px; color:#64748b;">Loading bookings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3n23Sg5vLufUpGZp9S6tRvbVwTbp1FvS9Fj5DYBIsXH2hriNJznl9EJEC_a9145s7/exec";

    let currentAdmin = { username: "", password: "" };
    let cachedBookings = [];

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("loginError");
      const loginBtn = document.getElementById("loginBtn");

      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying...";
      errorDiv.classList.add("hidden");

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "adminLogin", username: user, password: pass })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || "Invalid credentials.");

        currentAdmin.username = user;
        currentAdmin.password = pass;

        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("dashboardView").classList.remove("hidden");
        loadDashboardData();
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove("hidden");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });

    async function loadDashboardData() {
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getDashboard", username: currentAdmin.username, password: currentAdmin.password })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || "Failed to load dashboard.");

        cachedBookings = result.data.bookings || [];
        updateSummaryStats(result.data.summary);
        populateFilterDropdowns();
        renderBookings();
      } catch (err) {
        alert("Error loading dashboard: " + err.message);
      }
    }

    function updateSummaryStats(summary) {
      document.getElementById("statTotal").textContent = summary.total;
      document.getElementById("statPending").textContent = summary.pending;
      document.getElementById("statApproved").textContent = summary.approved;
      document.getElementById("statRejected").textContent = summary.rejected;
      document.getElementById("statCancelled").textContent = summary.cancelled;
    }

    function populateFilterDropdowns() {
      const facilitySelect = document.getElementById("facilityFilter");
      const jkpSelect = document.getElementById("jkpFilter");

      const facilities = [...new Set(cachedBookings.map(b => b.facility).filter(Boolean))].sort();
      const jkps = [...new Set(cachedBookings.map(b => b.jkp).filter(Boolean))].sort();

      facilitySelect.innerHTML = '<option value="ALL">All facilities</option>';
      facilities.forEach(f => {
        facilitySelect.innerHTML += `<option value="${f}">${f}</option>`;
      });

      jkpSelect.innerHTML = '<option value="ALL">All JKP</option>';
      jkps.forEach(j => {
        jkpSelect.innerHTML += `<option value="${j}">${j}</option>`;
      });
    }

    function formatDateDisplay(dateVal) {
      if (!dateVal) return "";
      try {
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return String(dateVal);
        return d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric" });
      } catch (e) {
        return String(dateVal);
      }
    }

    function formatTimeDisplay(timeVal) {
      if (!timeVal) return "";
      if (typeof timeVal === "string" && timeVal.includes("T")) {
        try {
          const d = new Date(timeVal);
          if (!isNaN(d.getTime())) return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
        } catch (e) {}
      }
      return String(timeVal);
    }

    function renderBookings() {
      const tbody = document.getElementById("bookingsTableBody");
      const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
      const statusVal = document.getElementById("statusFilter").value;
      const facilityVal = document.getElementById("facilityFilter").value;
      const jkpVal = document.getElementById("jkpFilter").value;
      const dateVal = document.getElementById("dateFilter").value;
      const sortBy = document.getElementById("sortSelect").value;

      let filtered = cachedBookings.filter(b => {
        if (statusVal !== "ALL" && b.status !== statusVal) return false;
        if (facilityVal !== "ALL" && b.facility !== facilityVal) return false;
        if (jkpVal !== "ALL" && b.jkp !== jkpVal) return false;
        
        if (dateVal) {
          const filterD = new Date(dateVal).toDateString();
          const startD = new Date(b.startDate).toDateString();
          if (filterD !== startD) return false;
        }

        if (searchQuery) {
          const match = (b.bookingId && b.bookingId.toLowerCase().includes(searchQuery)) ||
                        (b.bookerName && b.bookerName.toLowerCase().includes(searchQuery)) ||
                        (b.matricNumber && b.matricNumber.toLowerCase().includes(searchQuery)) ||
                        (b.email && b.email.toLowerCase().includes(searchQuery)) ||
                        (b.facility && b.facility.toLowerCase().includes(searchQuery)) ||
                        (b.purpose && b.purpose.toLowerCase().includes(searchQuery));
          if (!match) return false;
        }

        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === "newest") return new Date(b.timestamp) - new Date(a.timestamp);
        if (sortBy === "oldest") return new Date(a.timestamp) - new Date(b.timestamp);
        if (sortBy === "date_asc") return new Date(a.startDate) - new Date(b.startDate);
        if (sortBy === "status") {
          const weights = { PENDING: 1, APPROVED: 2, REJECTED: 3, CANCELLED: 4 };
          return (weights[a.status] || 5) - (weights[b.status] || 5);
        }
        return 0;
      });

      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#64748b;">No matching bookings found.</td></tr>';
        return;
      }

      filtered.forEach(b => {
        const tr = document.createElement("tr");

        const dateRangeText = formatDateDisplay(b.startDate);
        const timeText = formatTimeDisplay(b.startTime) + " - " + formatTimeDisplay(b.endTime);
        const adminNoteText = b.adminNotes ? `<br><small style="color:#b91c1c;">Admin note: ${b.adminNotes}</small>` : "";

        tr.innerHTML = `
          <td><strong>${b.bookingId}</strong><br><small style="color:#64748b;">${b.organisation || "Individual"}</small></td>
          <td><strong>${b.facility}</strong><br><span class="jkp-tag">${b.jkp || "General"}</span></td>
          <td>${dateRangeText}<br><small style="color:#64748b;">${timeText}</small></td>
          <td><strong>${b.bookerName}</strong><br><small style="color:#64748b;">${b.matricNumber}</small><br><small style="color:#64748b;">${b.email}</small></td>
          <td>${b.purpose || "-"}${adminNoteText}</td>
          <td><span class="badge ${b.status.toLowerCase()}">${b.status}</span></td>
          <td>
            <select class="action-select" onchange="updateStatus('${b.bookingId}', this.value)">
              <option value="" disabled selected>Update</option>
              <option value="PENDING">Pending</option>
              <option value="APPROVED">Approve</option>
              <option value="REJECTED">Reject</option>
              <option value="CANCELLED">Cancel</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateStatus(bookingId, newStatus) {
      let adminNotes = "";
      if (newStatus === "REJECTED" || newStatus === "CANCELLED") {
        adminNotes = prompt("Enter a reason / note for the applicant:") || "";
        if (!adminNotes.trim()) {
          alert("A reason is required when rejecting or cancelling a booking.");
          renderBookings();
          return;
        }
      } else {
        if (!confirm("Are you sure you want to update " + bookingId + " to " + newStatus + "?")) {
          renderBookings();
          return;
        }
      }

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "updateStatus",
            username: currentAdmin.username,
            password: currentAdmin.password,
            bookingId: bookingId,
            status: newStatus,
            adminNotes: adminNotes
          })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || "Failed to update status.");

        alert("Booking " + bookingId + " updated to " + newStatus);
        loadDashboardData();
      } catch (err) {
        alert("Error updating status: " + err.message);
        loadDashboardData();
      }
    }

    function logoutAdmin() {
      currentAdmin = { username: "", password: "" };
      cachedBookings = [];
      document.getElementById("dashboardView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }
  </script>
</body>
</html>
